server:
  port: 8080

spring:
  application:
    name: aki-admin
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/aki_sys?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: password
  data:
    redis:
      host: localhost
      port: 6379
      # password:            # 本地 Redis 无密码
      timeout: 5s

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    # SQL 日志走 SLF4J,不要用 StdOutImpl:
    # StdOutImpl 直接写 System.out,在中文 Windows 上按 GBK 编码,而 logback 写 UTF-8,
    # 两种编码混进同一个日志文件,用编辑器打开必然出现乱码。
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    banner: false
    db-config:
      id-type: auto

# 日志统一 UTF-8(Windows 默认 GBK,不显式指定则中文日志会乱码)
logging:
  charset:
    console: UTF-8
    file: UTF-8
  level:
    # 换成 Slf4jImpl 后,SQL 语句按 mapper 包名以 DEBUG 级别打印
    com.aki.admin.mapper: debug

springdoc:
  swagger-ui:
    path: /swagger-ui.html

# 自定义配置
aki:
  jwt:
    # 签名密钥(HS256,至少 32 字节,生产环境请更换并通过环境变量注入)
    secret: aki-admin-secret-key-0123456789-abcdefghijklmn
    # token 有效期(秒),与 Redis 缓存一致
    expire-seconds: 28800
