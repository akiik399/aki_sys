# =====================================================
# aki_sys nginx 站点配置
# 安装位置: /etc/nginx/conf.d/aki-admin.conf (或 sites-available/ 下再软链)
#
# 这个文件解决两件事:
#   1. 托管前端构建产物 frontend/dist
#   2. 把 /api 反向代理到后端 8080
# 两点都和本地开发(vite dev server 的 proxy)行为对齐。
# =====================================================

server {
    listen 80;
    listen [::]:80;

    # 改这里:填你的域名;还没有域名就先写服务器公网 IP,或直接用 _
    server_name _;

    # 前端构建产物目录(上传 dist 的内容到这里,不是 dist 这一层)
    root /opt/aki-admin/web;
    index index.html;

    # 字符集显式声明,避免中文页面被浏览器猜错编码
    charset utf-8;

    access_log /var/log/nginx/aki-admin.access.log;
    error_log  /var/log/nginx/aki-admin.error.log;

    # 开启 gzip:Element Plus 的 js/css 体积不小,压缩后首屏明显变快
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/wasm;

    # ---------------- 接口反向代理 ----------------
    # 前端 axios 的 baseURL 是 '/api',后端控制器也在 /api 前缀下,
    # 所以这里【绝对不能】rewrite 掉 /api 前缀 —— 否则后端一律 404。
    location /api/ {
        proxy_pass http://127.0.0.1:8080;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        proxy_connect_timeout 5s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;

        # 上传大文件时按需调大(当前接口只有 JSON,1M 足够)
        client_max_body_size 1m;
    }

    # ---------------- 静态资源缓存 ----------------
    # Vite 构建出的文件名带内容 hash(如 index-a1b2c3d4.js),
    # 内容一变文件名就变,所以可以放心长缓存。
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # index.html 绝不能缓存:否则发新版本后用户拿到的还是旧 html,
    # 它引用的旧 assets 已经被删,直接白屏。
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires -1;
    }

    # ---------------- SPA 路由回退 ----------------
    # 前端用的是 createWebHistory(),真实路径 /admin/system/user 在服务器上
    # 并不存在对应文件。没有这行 try_files,刷新或直接粘贴链接就会 404。
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 隐藏文件(含 .git / .env)一律拒绝
    location ~ /\. {
        deny all;
        return 404;
    }
}

# =====================================================
# 配好域名之后,用 certbot 一键上 HTTPS:
#   sudo apt install -y certbot python3-certbot-nginx
#   sudo certbot --nginx -d 你的域名
# certbot 会自动改写本文件、加 443 监听并设置自动续期。
# 上了 HTTPS 之后,记得把下面的安全响应头取消注释。
# =====================================================
# add_header X-Content-Type-Options "nosniff" always;
# add_header X-Frame-Options "SAMEORIGIN" always;
# add_header Referrer-Policy "strict-origin-when-cross-origin" always;
